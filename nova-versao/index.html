<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafbfc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Lucas Azambuja. I keep things running.">
  <meta name="robots" content="noindex, nofollow">
  <title>Lucas Azambuja</title>
  <link rel="canonical" href="https://lucasazambuja.dev/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lucas Azambuja">
  <meta property="og:description" content="I keep things running">
  <meta property="og:url" content="https://lucasazambuja.dev/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171b22'/%3E%3Ctext x='12' y='45' fill='white' font-family='Arial,sans-serif' font-weight='700' font-size='38'%3Ela%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --background: #fafbfc;
      --text: #171b22;
      --muted: #626975;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 3rem 1.5rem;
      background: var(--background);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(100%, 52rem); text-align: center; }
    h1 {
      margin: 0;
      font-size: clamp(2.75rem, 7vw, 5rem);
      font-weight: 600;
      letter-spacing: -.055em;
      line-height: 1.12;
      text-wrap: balance;
    }
    p {
      margin: 1.25rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      line-height: 1.6;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .25rem 1.5rem;
      margin-top: 2rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--muted);
      font-size: .875rem;
      text-decoration: none;
    }
    a:hover { color: var(--text); text-decoration: underline; text-underline-offset: .3em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; border-radius: 2px; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --background: #111315; --text: #eef0f4; --muted: #a4abb7; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Lucas Azambuja</h1>
    <p lang="en">I keep things running</p>
    <nav aria-label="Contatos">
      <a href="mailto:lucasazambuja42@gmail.com">E-mail</a>
      <a href="https://www.linkedin.com/in/lucasazambuja/">LinkedIn</a>
      <a href="https://github.com/lucas-azambuja">GitHub</a>
      <a href="https://twitter.com/lucasazambuja42">X / Twitter</a>
    </nav>
  </main>
</body>
</html>
